name: document-service-ui

services:
  document-service-ui:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${UI_IMAGE:-document-service-ui}:${UI_VERSION:-latest}
    container_name: ${UI_CONTAINER_NAME:-document-service-ui}
    restart: unless-stopped

    environment:
      API_HOST: ${API_HOST:-host.docker.internal}
      API_PORT: ${API_PORT:-55535}

    # Lets the default API_HOST reach a mcp-document-service published on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "${UI_BIND_ADDRESS:-0.0.0.0}:${UI_PORT:-5431}:80"

    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
